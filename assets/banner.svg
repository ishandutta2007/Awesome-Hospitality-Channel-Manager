<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a">
        <animate attributeName="stop-color" values="#0f172a;#1e1b4b;#0f172a" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#1e293b">
        <animate attributeName="stop-color" values="#1e293b;#0f172a;#1e293b" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#0284c7">
        <animate attributeName="stop-color" values="#0284c7;#6366f1;#0284c7" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 800; font-size: 44px; fill: #ffffff; }
    .subtitle { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 500; font-size: 20px; fill: #94a3b8; }
    .tag { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 600; font-size: 14px; fill: #38bdf8; }
    .pulse-circle { animation: pulse 3s ease-in-out infinite alternate; }
    @keyframes pulse { 0% { r: 4px; opacity: 0.3; } 100% { r: 8px; opacity: 0.9; } }
  </style>

  <!-- Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />

  <!-- Grid Pattern Overlay -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="200" y1="0" x2="200" y2="360" />
    <line x1="400" y1="0" x2="400" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="800" y1="0" x2="800" y2="360" />
    <line x1="1000" y1="0" x2="1000" y2="360" />
  </g>

  <!-- Animated Floating Sync Nodes & Connections -->
  <g opacity="0.4" stroke="url(#accentGrad)" stroke-width="2" stroke-dasharray="6,6">
    <line x1="900" y1="110" x2="1080" y2="80">
      <animate attributeName="stroke-dashoffset" values="0;24" dur="2s" repeatCount="indefinite" />
    </line>
    <line x1="900" y1="110" x2="1030" y2="220">
      <animate attributeName="stroke-dashoffset" values="0;24" dur="2s" repeatCount="indefinite" />
    </line>
    <line x1="1080" y1="80" x2="1030" y2="220">
      <animate attributeName="stroke-dashoffset" values="24;0" dur="2s" repeatCount="indefinite" />
    </line>
    <line x1="900" y1="110" x2="840" y2="250">
      <animate attributeName="stroke-dashoffset" values="0;24" dur="2s" repeatCount="indefinite" />
    </line>
  </g>

  <!-- Node Circles -->
  <circle cx="900" cy="110" r="18" fill="#38bdf8" opacity="0.85" filter="url(#glow)">
    <animate attributeName="r" values="16;20;16" dur="3s" repeatCount="indefinite" />
  </circle>
  <circle cx="1080" cy="80" r="14" fill="#818cf8" opacity="0.85" filter="url(#glow)">
    <animate attributeName="r" values="12;16;12" dur="2.5s" repeatCount="indefinite" />
  </circle>
  <circle cx="1030" cy="220" r="16" fill="#f472b6" opacity="0.85" filter="url(#glow)">
    <animate attributeName="r" values="14;18;14" dur="3.5s" repeatCount="indefinite" />
  </circle>
  <circle cx="840" cy="250" r="12" fill="#34d399" opacity="0.85" filter="url(#glow)">
    <animate attributeName="r" values="10;14;10" dur="2.8s" repeatCount="indefinite" />
  </circle>

  <!-- Hotel / Distribution Graphic Symbols -->
  <text x="893" y="117" font-size="18" fill="#ffffff">🏨</text>
  <text x="1073" y="86" font-size="15" fill="#ffffff">🌐</text>
  <text x="1023" y="226" font-size="16" fill="#ffffff">⚡</text>
  <text x="833" y="255" font-size="14" fill="#ffffff">📊</text>

  <!-- Tag Pill -->
  <rect x="70" y="55" width="230" height="34" rx="17" fill="#0369a1" opacity="0.4" />
  <rect x="70" y="55" width="230" height="34" rx="17" fill="none" stroke="#38bdf8" stroke-width="1.2" />
  <circle cx="88" cy="72" r="5" fill="#38bdf8">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" />
  </circle>
  <text x="104" y="77" class="tag">HOSPITALITY TECH ECOSYSTEM</text>

  <!-- Main Title -->
  <text x="70" y="145" class="title">Awesome Hospitality</text>
  <text x="70" y="195" class="title" fill="url(#accentGrad)">Channel Manager</text>

  <!-- Subtitle -->
  <text x="70" y="245" class="subtitle">Curated SaaS Platforms, OTA Connectors &amp; Open-Source PMS Solutions</text>

  <!-- Feature Highlights / Badges in Banner -->
  <g transform="translate(70, 275)">
    <rect x="0" y="0" width="135" height="28" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <text x="12" y="19" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">🔄 2-Way Sync</text>

    <rect x="145" y="0" width="155" height="28" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <text x="157" y="19" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">📈 Rate &amp; Inventory</text>

    <rect x="310" y="0" width="150" height="28" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <text x="322" y="19" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">🌐 OTA Distribution</text>
  </g>
</svg>
